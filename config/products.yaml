# Товарные категории. Каждый товар — набор regex по нормализованному тексту.
# size_patterns — размер/типоразмер, специфичный для товара (группа 1..3 — числа).
products:
  # ---------- Металлопрокат ----------
  - id: rebar
    name: "арматура"
    group: "металлопрокат"
    patterns:
      - '\bарматур\w*'
      - '\bа500с?\b'
      - '\bа400\b'
      - '\bа[- ]?iii\b'
    size_patterns:
      - '\bарматур\w*\s*(?:ф|d|диаметр(?:ом)?|№|номер)?\s*(\d{1,2})(?:\s*мм)?\b(?!\s*(?:м\b|метр|шт|тонн|т\b|кг))'
      - '\b(?:ф|d|диаметр(?:ом)?)\s*(\d{1,2})(?:\s*мм)?\b'
      - '\b(\d{1,2})[- ]?(?:ка|ку|кой|мм)\b'

  - id: profile_pipe
    name: "профильная труба"
    group: "металлопрокат"
    patterns:
      - '\bпрофильн\w*\s+труб\w*'
      - '\bпроф\.?\s*труб\w*'
      - '\bпрофтруб\w*'
      - '\bпрофил[ье]к\w*'
      - '\bквадратн\w*\s+труб\w*'

  - id: pipe
    name: "труба"
    group: "металлопрокат"
    patterns:
      - '\bтруб[аыуеой]?\b(?!\s+пвх|\s+пнд|\s+канализац|\s+пластик|\s+полипропил)'
      - '\bвгп\b'
      - '\bводогазопроводн\w*'
      - '\bэлектросварн\w*'
    size_patterns:
      - '\bтруб\w*\s*(?:ф|d|диаметр(?:ом)?)?\s*(\d{2,3})(?:\s*мм)?\b(?!\s*(?:м\b|метр|шт|тонн|т\b|кг|x))'

  - id: sheet
    name: "лист"
    group: "металлопрокат"
    patterns:
      - '\bлист\w*\s+(?:стальн|металл|гк|хк|горячекатан|холоднокатан|оцинкован|рифлен)\w*'
      - '\b(?:стальн|металлическ|горячекатан|холоднокатан|оцинкован|рифлен)\w*\s+лист\w*'
      - '\bлистов\w+\s+металл\w*'
      - '\bоцинковк\w*'
      - '\bлист\s+\d{1,2}(?:[.,]\d)?\s*(?:мм|x)'

  - id: angle
    name: "уголок"
    group: "металлопрокат"
    patterns:
      - '\bуголок\b(?!\s+(?:пластик|пвх|для\s+плитки|керамич))'
      - '\bуголк\w*\s+(?:металл|стальн)\w*'
      - '\b(?:металл|стальн)\w*\s+уголк\w*'
    size_patterns:
      - '\bугол(?:ок|ка|ку|ком)\s*(\d{2,3})(?:\s*x\s*(\d{2,3}))?(?:\s*x\s*(\d{1,2}))?\b(?!\s*(?:м\b|метр|шт))'

  - id: channel
    name: "швеллер"
    group: "металлопрокат"
    patterns:
      - '\bшвеллер\w*'
    size_patterns:
      - '\bшвеллер\w*\s*(?:№|номер)?\s*(\d{1,2}[пуа]?)\b(?!\s*(?:м\b|метр|шт))'

  - id: ibeam
    name: "двутавр"
    group: "металлопрокат"
    patterns:
      - '\bдвутавр\w*'
      - '\bбалк\w*\s+двутавров\w*'
    size_patterns:
      - '\bдвутавр\w*\s*(?:№|номер)?\s*(\d{1,2}[бшк]?\d?)\b(?!\s*(?:м\b|метр|шт))'

  - id: mesh
    name: "сетка"
    group: "металлопрокат"
    patterns:
      - '\bсетк\w*\s+(?:сварн|кладочн|дорожн|строительн|оцинкован|рабиц|армирующ|штукатурн|металл)\w*'
      - '\b(?:сварн|кладочн|дорожн|строительн|оцинкован|металлическ)\w*\s+сетк\w*'
      - '\bрабиц\w*'
      - '\bсетк[аиуе]\b(?!\s+(?:москитн|для\s+окон|маскировочн|футбольн))'

  - id: wire
    name: "проволока"
    group: "металлопрокат"
    patterns:
      - '\bпроволок\w*'
      - '\bвязальн\w*'

  - id: metal_structures
    name: "металлоконструкции"
    group: "металлопрокат"
    patterns:
      - '\bметаллоконструкци\w*'
      - '\bзакладн\w*(?:\s+детал\w*)?'
      - '\bметаллокаркас\w*'

  - id: profnastil
    name: "профнастил"
    group: "металлопрокат"
    patterns:
      - '\bпрофнастил\w*'
      - '\bпрофлист\w*'
      - '\bметаллочерепиц\w*'

  - id: metal_generic
    name: "металл"
    group: "металлопрокат"
    patterns:
      - '\bметалл(?:а|у|ом|е)?\b'
      - '\bметаллопрокат\w*'
      - '\bжелез[оа]\b'

  # ---------- Стройматериалы (можно отключить, удалив блок) ----------
  - id: cement
    name: "цемент"
    group: "стройматериалы"
    patterns: ['\bцемент\w*']
  - id: sand
    name: "песок"
    group: "стройматериалы"
    patterns: ['\bпес(?:ок|ка|ку|ком)\b']
  - id: gravel
    name: "щебень"
    group: "стройматериалы"
    patterns: ['\bщеб(?:ень|ня|ню|нем)\w*', '\bотсев\w*']
  - id: brick
    name: "кирпич"
    group: "стройматериалы"
    patterns: ['\bкирпич\w*']
  - id: blocks
    name: "блоки"
    group: "стройматериалы"
    patterns: ['\bгазоблок\w*', '\bпеноблок\w*', '\bшлакоблок\w*', '\bкерамзитоблок\w*', '\bгазобетон\w*']

# Строительный контекст — слабый признак, когда товар не назван прямо.
construction_context:
  - id: fence
    pattern: '\bзабор\w*'
  - id: canopy
    pattern: '\bнавес\w*'
  - id: gates
    pattern: '\bворот\w*|\bкалитк\w*'
  - id: frame
    pattern: '\bкаркас\w*'
  - id: welding
    pattern: '\bсварить|\bсварка|\bзаварить|\bприварить'
  - id: foundation
    pattern: '\bфундамент\w*|\bармопояс\w*|\bперекрыти\w*|\bстяжк\w*'
  - id: building
    pattern: '\bстро(?:ю|им|йка|йку|ительств\w*)\b|\bгараж\w*|\bсклад\w*|\bангар\w*|\bпристройк\w*|\bкрыш\w*'

# Общие извлекатели (не привязаны к товару). Группы 1..3 — числа.
sizes:
  - '\b(\d{2,3})\s*x\s*(\d{2,3})(?:\s*x\s*(\d(?:[.,]\d)?))?\b'

amounts:
  # "3 тонны", "100 м", "20 шт", "50 кг"
  - '\b(\d+(?:[.,]\d+)?)\s*(кг|килограмм\w*|тонн\w*|т|метр\w*|м|п\.?м|шт|штук\w*|лист\w*|пач\w*|мешк\w*|куб\w*|м3|поддон\w*|палет\w*)\b'
  # "метров 100", "штук по 20", "тонны две"
  - '\b(тонн\w*|метр\w*|штук\w*|шт|лист\w*|кг|кубов|мешк\w*)\s+(?:по\s+|около\s+|примерно\s+|где-то\s+)?(\d+(?:[.,]\d+)?)\b'
  # словесные числительные
  - '\b(одн[ау]|дв[ае]|три|четыре|пять|шесть|семь|восемь|девять|десять|пятнадцать|двадцать|тридцать|сорок|пятьдесят|сто|пар[ау]|несколько|пол\s?тонны|полтонны|тонн[ау])\s+(тонн\w*|метр\w*|шт\w*|лист\w*|пач\w*|кг|килограмм\w*|мешк\w*|куб\w*|поддон\w*)\b'