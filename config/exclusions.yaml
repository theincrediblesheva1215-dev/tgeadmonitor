# Признаки продавца / рекламы / шума. Feature "sell".
sell_intents:
  - id: sell
    pattern: '\b(?:продаю|продам|продаем|продается|продаются|продажа|распродажа|реализуем|реализую|предлагаем|предлагаю|отдам|отдаю)\b'
  - id: in_stock
    pattern: '\bв\s+наличии\b|\bвсегда\s+в\s+наличии\b|\bна\s+складе\b'
  - id: company
    pattern: '\bнаш[аи]?\s+(?:компани\w*|склад\w*|фирм\w*|магазин\w*|баз[аеы])\b|\bметаллобаз\w*|\bсо\s+склада\b|\bот\s+производителя\b'
  - id: wholesale
    pattern: '\bоптом\b|\bв\s+розницу\b|\bрозница\b|\bопт\b|\bмелкий\s+опт\b'
  - id: price_per
    pattern: '\bцен\w*\s+(?:за|от)\s+(?:тонн\w*|метр\w*|шт\w*|кг|штук\w*|лист\w*|погонн\w*)'
  - id: call_to_action
    pattern: '\bзвоните\b|\bобращайтесь\b|\bпишите\s+в\s+(?:лс|личку|личные|директ)\b|\bзаказывайте\b|\bуспейте\b|\bакци[яи]\b|\bскидк\w+'
  - id: services
    pattern: '\bвыполним\b|\bизготовим\b|\bизготовление\b|\bоказываем\b|\bуслуги\s+сварщ\w*|\bпод\s+ключ\b|\bвыезд\s+замерщика\b'
  - id: seller_asks
    pattern: '\bкому\s+нужн\w*'
  - id: jobs
    pattern: '\b(?:требуется|требуются|ищем|нужен|нужны)\s+(?:сварщик|рабоч|разнорабоч|монтажник|водител|менеджер|грузчик|сотрудник|бригад)\w*'

# Жёсткие исключения: сообщение не анализируется вообще.
hard_exclusions:
  min_length: 6
  patterns:
    - id: bot_command
      pattern: '^/\w+'

# Рекламные признаки. Один признак сообщение не исключает —
# feature "ad" ставится при min_features и более совпавших признаков.
ad_features:
  min_features: 2
  many_products_threshold: 4
  price_count_threshold: 2
  emoji_threshold: 5
  caps_ratio_threshold: 0.5
  caps_min_letters: 20