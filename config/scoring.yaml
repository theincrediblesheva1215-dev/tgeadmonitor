# Веса признаков. Каждый признак учитывается один раз, сколько бы совпадений ни было.
weights:
  intent: 5
  product: 4
  size: 2
  amount: 2
  location: 2
  location_fallback: 0   # география взята из чата, а не из текста
  context: 1
  question: 1
  sell: -8
  ad: -5
  many_products: -3
  url: -2

thresholds:
  notify: 8      # >= notify  -> уведомление
  potential: 5   # >= potential -> сохранить как potential, без уведомления

# Hard rules. Доступные признаки: intent, intent_strong, product, size, amount,
# location, context, question, sell, ad, many_products, url.
# Сначала проверяются not_lead, затем lead.
hard_rules:
  not_lead:
    - id: seller_with_product
      all: [sell, product]
      none: [intent_strong]
  lead:
    - id: strong_buy_intent_with_product
      all: [intent_strong, product]
      none: [sell, ad]

dedup:
  window_days: 7
  fuzzy_threshold: 90            # похожесть с любым недавним лидом
  same_user_fuzzy_threshold: 80  # похожесть с недавним лидом того же автора
  max_candidates: 500