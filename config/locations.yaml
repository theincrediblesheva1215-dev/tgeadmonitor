# Расширенный scoring.yaml для tgeadmonitor
#
# Цель профиля:
# - максимально надёжно поднимать прямые запросы на товар;
# - не терять "неидеально сформулированные" заявки без явного слова "куплю";
# - сильнее подавлять продавцов, каталоги и рекламные объявления;
# - не превращать один только строительный контекст в полноценный lead;
# - сохранять пограничные случаи как potential для последующего анализа.
#
# ВАЖНО:
# Здесь используются ТОЛЬКО признаки, которые текущий Matcher/Loader уже умеет
# создавать и обрабатывать. Файл можно использовать без изменения Python-кода.
#
# Каждый feature учитывается в score только один раз независимо от числа совпадений.

weights:
  # -------------------- Покупательские сигналы --------------------
  # Любое распознанное намерение: "нужна", "ищу", "требуется", "подскажите где"...
  intent: 5

  # Дополнительный бонус к intent для strong=true:
  # "куплю", "хочу купить", "где купить", "кто продаёт", "нужен поставщик"...
  # intent_strong всегда появляется вместе с intent, поэтому итоговый вклад
  # сильного намерения = intent + intent_strong.
  intent_strong: 3

  # Назван конкретный товар из products.yaml.
  # Это главный предметный признак: сообщение хотя бы относится к нашему ассортименту.
  product: 5

  # Есть конкретный типоразмер: 12 мм, 40x20x2, труба 57 и т.п.
  size: 2

  # Есть объём/количество: 2 тонны, 100 м, 30 шт...
  amount: 2

  # География явно написана в сообщении.
  location: 2

  # География известна только потому, что сообщение пришло из локального чата.
  # Не должна сама увеличивать уверенность в том, что это покупатель.
  location_fallback: 0

  # Строительный контекст: забор, навес, каркас, фундамент и т.п.
  # Слабый сигнал. Сам по себе не должен превращать сообщение в lead.
  context: 1

  # Вопросительная форма — небольшой плюс к вероятности запроса/поиска.
  question: 1

  # -------------------- Отрицательные сигналы --------------------
  # Явные признаки продавца: "продам", "в наличии", "со склада",
  # "звоните", "оптом", "изготовим" и т.п.
  sell: -10

  # Набор рекламных признаков (телефон/URL/username/цены/emoji/CAPS/каталог и т.п.).
  ad: -6

  # Много разных товаров чаще похоже на каталог, но иногда бывает B2B-закупкой,
  # поэтому штраф умеренный, а не убийственный.
  many_products: -2

  # Ссылка чаще встречается в рекламе, но покупатель тоже может прислать пример товара.
  url: -2


thresholds:
  # Автоуведомление оператору.
  # Порог намеренно выше старого: прямые запросы на товар всё равно проходят
  # через hard rules, а "куплю гараж в Ростове" и похожие сообщения не должны
  # становиться lead только из-за intent + location + context.
  notify: 12

  # Пограничные сообщения сохраняются как potential без уведомления.
  # Это полезный слой для последующего анализа false negative / новых формулировок.
  potential: 8


# Hard rules имеют приоритет над числовым score.
#
# Порядок работы текущего Scorer:
#   1. сначала hard_rules.not_lead;
#   2. затем hard_rules.lead;
#   3. только потом thresholds.
#
# all  — все перечисленные признаки обязаны присутствовать;
# none — ни одного из перечисленных признаков быть не должно.
hard_rules:

  # ==================================================================
  # ЖЁСТКИЕ ОТРИЦАТЕЛЬНЫЕ ПРАВИЛА
  # ==================================================================
  not_lead:

    # Классическая карточка продавца:
    # товар + явный sell-сигнал без сильного покупательского намерения.
    - id: seller_with_product
      all: [sell, product]
      none: [intent_strong]

    # Реклама продавца даже если конкретный товар matcher не распознал.
    - id: seller_advertisement
      all: [sell, ad]
      none: [intent_strong]

    # Каталог из многих товаров + рекламная структура.
    - id: advertising_catalog
      all: [ad, many_products]
      none: [intent_strong]

    # Рекламное сообщение со ссылкой.
    - id: advertising_with_url
      all: [ad, url]
      none: [intent_strong]

    # Продавец с URL: сайт, прайс, карточка товара, канал и т.п.
    - id: seller_with_url
      all: [sell, url]
      none: [intent_strong]

    # Продавец перечисляет большой ассортимент.
    - id: seller_catalog
      all: [sell, many_products]
      none: [intent_strong]

    # Особенно сильная комбинация: продавец + реклама + товар.
    # Правило частично пересекается с seller_with_product/seller_advertisement,
    # но оставлено отдельно как явная страховка и понятная причина в explain().
    - id: commercial_offer
      all: [sell, ad, product]
      none: [intent_strong]


  # ==================================================================
  # ЖЁСТКИЕ ПОЛОЖИТЕЛЬНЫЕ ПРАВИЛА
  # ==================================================================
  lead:

    # Самый надёжный кейс:
    # "куплю арматуру", "где купить трубу", "нужен поставщик металлопроката".
    - id: strong_buy_intent_with_product
      all: [intent_strong, product]
      none: [sell, ad]

    # Обычное покупательское намерение + конкретный товар:
    # "нужна арматура", "ищу трубу", "требуется профлист".
    # Это позволяет не зависеть от дополнительных баллов за географию/размер.
    - id: purchase_intent_with_product
      all: [intent, product]
      none: [sell, ad]

    # Не написал "нужно/куплю", но вопрос + товар + размер:
    # "Арматура 12 есть?", "Труба 40x20 у кого?"
    - id: implicit_request_product_size_question
      all: [product, size, question]
      none: [sell, ad]

    # Не написал явный intent, но есть товар + объём + вопрос:
    # "Арматура 2 тонны есть?"
    - id: implicit_request_product_amount_question
      all: [product, amount, question]
      none: [sell, ad]

    # Товар + география + вопрос:
    # "Арматура в Аксае есть?", "Где труба в Батайске?"
    - id: implicit_request_product_location_question
      all: [product, location, question]
      none: [sell, ad]

    # Закупочная спецификация без глагола:
    # "Арматура 12, 2 тонны" / "Труба 40x20, 100 метров".
    - id: procurement_specification
      all: [product, size, amount]
      none: [sell, ad]

    # Объёмный запрос с явной географией:
    # "Арматура 5 тонн, Ростов".
    - id: procurement_volume_with_location
      all: [product, amount, location]
      none: [sell, ad]

    # Запрос материала под конкретную задачу:
    # "Металл на навес есть?", "Профлист на забор?"
    - id: project_material_question
      all: [product, context, question]
      none: [sell, ad]

    # Сильное намерение + товар + спецификация.
    # Формально strong_buy_intent_with_product уже достаточно, но отдельное правило
    # делает explain() более осмысленным, если его поднять выше в будущем.
    - id: strong_specified_purchase
      all: [intent_strong, product, size]
      none: [sell, ad]

    # Сильное намерение + товар + объём.
    - id: strong_volume_purchase
      all: [intent_strong, product, amount]
      none: [sell, ad]


# Дедупликация применяется только к lead.
dedup:
  # Смотрим недавние лиды за неделю.
  window_days: 7

  # Для разных авторов/общего пула требуем почти одинаковый текст,
  # чтобы случайно не склеивать разные реальные заявки.
  fuzzy_threshold: 92

  # Для одного и того же автора можно быть немного мягче:
  # повторная публикация обычно меняет пару слов/пунктуацию.
  same_user_fuzzy_threshold: 82

  # Максимум недавних кандидатов для fuzzy-сравнения.
  # Увеличено относительно стартового значения, чтобы дедуп не деградировал
  # после подключения нескольких активных локальных чатов.
  max_candidates: 1000


# -------------------------------------------------------------------
# ЛОГИКА ЭТОГО ПРОФИЛЯ В ДВУХ СЛОВАХ
# -------------------------------------------------------------------
#
# 1. product + intent без seller/ad -> lead независимо от score.
# 2. Явной фразы "куплю" не требуется:
#    спецификация/объём/вопрос могут дать lead сами.
# 3. context остаётся слабым признаком, а не заменой product.
# 4. География из самого чата = 0 баллов; это контекст источника, не доказательство.
# 5. sell является очень сильным отрицательным сигналом.
# 6. ad не является абсолютным баном: сначала работают hard rules,
#    затем штраф. Это оставляет возможность позже точнее разделить рекламу
#    и покупателя, который просто оставил контакты.
# 7. potential специально широкий: туда попадают пограничные формулировки,
#    которые удобно использовать для расширения словарей и тестового датасета.
#
# После накопления 100–300 реальных размеченных сообщений имеет смысл
# подбирать веса/пороги уже по precision/recall, а не "на глаз".
