# Признаки намерения купить.
# strong: true — участвует в hard rules ("куплю + товар" => лид).
# Совпадение, перед которым стоит "не " (например "не нужна"), игнорируется.
purchase_intents:
  - id: need
    pattern: '\bнужн(?:а|о|ы|ен)\b'

  - id: need_buy
    pattern: '\b(?:надо|нужно|хочу|хотим|хотел\s+бы|планиру\w+|собираюсь)\s+(?:купить|приобрести|заказать|взять|закупить)\b'
    strong: true

  - id: buy
    pattern: '\b(?:куплю|купим|купил\s+бы|приобрету|закажу|закуплю|возьму)\b'
    strong: true

  - id: search
    pattern: '\bищ(?:у|ем)\b'

  - id: required
    pattern: '\b(?:требуется|требуются|необходим[оаы]?|потребуется|потребуются)\b'

  - id: where_buy
    pattern: '\b(?:где|у\s+кого|откуда)\b(?:\s+\S+){0,4}?\s+(?:купить|взять|заказать|приобрести|найти|достать|закупить)\b'
    strong: true

  - id: who_sells
    pattern: '\bкто\b(?:\s+\S+){0,2}?\s+(?:продает|продаст|возит|привезет|привозит|поставляет|поставит|торгует)\b'
    strong: true

  - id: who_can_deliver
    pattern: '\bкто\s+(?:может|сможет|мог\s+бы)\s+(?:привезти|доставить|продать|поставить)\b'
    strong: true

  - id: supplier
    pattern: '\b(?:нужен|ищу|ищем|посоветуйте|подскажите|порекомендуйте|нужны)\b(?:\s+\S+){0,2}?\s+поставщик\w*'
    strong: true

  - id: advise_where
    pattern: '\b(?:подскажите|посоветуйте|подскажете|посоветуете)\b(?:\s+пожалуйста)?\s+(?:где|у\s+кого|кто)\b'

  - id: anyone_has
    pattern: '\bесть\s+(?:ли\s+)?у\s+кого(?:-нибудь|-то)?\b'